name: Generate sermon guide

on:
  schedule:
    # Every 2 hours. Two reasons this is not overkill:
    #
    # 1. The feed publishes Sun 48 / Mon 8 / Tue 3 / Wed 1 across the last 60
    #    episodes, so a Monday-only cron would skip ~20% of weeks entirely.
    # 2. GitHub delays scheduled runs under load -- measured on this repo,
    #    a 13:00 UTC cron actually started at 15:58, 18:06 and 17:04 on three
    #    consecutive days (+3h to +5h), and GitHub drops runs outright during
    #    heavy load. A single daily trigger cannot hold a hard deadline.
    #
    # Requirement: published before 18:00 ET Monday, earlier preferred. At this
    # cadence the guide typically lands Sunday evening, hours after the sermon
    # posts, and a delayed or dropped run costs at most one 2-hour slot.
    # Idle runs exit before any install or API call, so they are ~free.
    - cron: '0 */2 * * *'
    # Sunday late-afternoon and all day Monday, poll every 30 minutes: most
    # episodes land Sunday, and the Monday stragglers have arrived as late as
    # 17:44 ET against an 18:00 deadline. Idle runs cost nothing.
    - cron: '*/30 20-23 * * 0'
    - cron: '*/30 11-23 * * 1'
  workflow_dispatch:
    inputs:
      episode:
        description: 'Episode GUID to re-run (bypasses state)'
        required: false
      force:
        description: 'Overwrite an existing guide'
        type: boolean
        default: false
      mode:
        description: 'Which edition(s) to generate'
        type: choice
        options: [both, classic, new]
        default: both

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: sermon-guide
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check for a new episode
        id: check
        run: |
          pip install -e . --quiet
          if python -m tpsermons.cli pending --quiet; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No new episode; skipping the expensive steps."
          fi

      - name: Install system tools
        if: steps.check.outputs.found == 'true' || inputs.episode != ''
        run: sudo apt-get update && sudo apt-get install -y poppler-utils ffmpeg

      - name: Generate guide
        if: steps.check.outputs.found == 'true' || inputs.episode != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Optional. Absent means the guide publishes without being emailed.
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: |
          python -m tpsermons.cli run \
            ${{ inputs.episode && format('--episode {0}', inputs.episode) || '' }} \
            ${{ inputs.force && '--force' || '' }} \
            --mode ${{ inputs.mode || 'both' }}

      - name: Save transcript cache even if generation failed
        if: always() && (steps.check.outputs.found == 'true' || inputs.episode != '')
        run: |
          if [ -n "$(git status --porcelain transcripts)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add transcripts
            git commit -m "transcript cache: $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin master
            git push
          fi

      - name: Commit new guides
        # always(): a run where one week failed must still commit the weeks
        # that succeeded. Nothing is written when generation produced nothing.
        if: always() && (steps.check.outputs.found == 'true' || inputs.episode != '')
        run: |
          if [ -n "$(git status --porcelain guides index.html state.json transcripts)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add guides index.html state.json transcripts
            git commit -m "guide: $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin master
            git push
          else
            echo "No new guide; nothing to commit."
          fi

      - name: Announce the new guide
        if: steps.check.outputs.found == 'true' || inputs.episode != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dir = 'guides';
            const all = fs.readdirSync(dir).filter(f => f.endsWith('.json')).sort();
            if (!all.length) return;
            // Newest week; link its New edition when there is one.
            const newestDate = all[all.length - 1].slice(0, 10);
            const week = all.filter(f => f.startsWith(newestDate));
            const latest = week.find(f => f.endsWith('-new.json')) || week[week.length - 1];
            const g = JSON.parse(fs.readFileSync(`${dir}/${latest}`, 'utf8'));
            const base = 'https://colsonrice.github.io/tpsermons/guides/';
            const page = latest.replace('.json', '.html');
            const classic = page.replace('-new.html', '.html');
            const preacher = g.speaker ? (g.speaker_role ? `${g.speaker}, ${g.speaker_role}` : g.speaker) : '';
            const firstAsk = ((g.sections || [])[0] || {}).questions || [];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Guide ready: ${g.guide_title || g.title}`,
              body: [
                `**${g.guide_title || g.title}**`,
                [g.title, g.passage, preacher].filter(Boolean).join(' · '),
                '',
                `New: ${base}${page}`,
                page !== classic ? `Classic: ${base}${classic}` : '',
                '',
                g.goal ? `**Goal:** ${g.goal}` : '',
                firstAsk.length ? `**First question:** ${firstAsk[0].ask}` : '',
              ].filter(Boolean).join('\n'),
              labels: ['guide'],
            });

      - name: Upload site
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: generate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  report-failure:
    needs: [generate]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Sermon guide run failed (${new Date().toISOString().slice(0,10)})`,
              body: `The scheduled run failed. [View logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`
            })
