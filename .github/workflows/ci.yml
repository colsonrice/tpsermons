name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  workflows:
    # A stray quote once made daily.yml unparseable on GitHub. PyYAML accepted
    # it, so nothing flagged it, and every scheduled run silently stopped.
    # actionlint checks GitHub's expression syntax, which PyYAML cannot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint workflow files
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - name: Run test suite (offline, no network)
        run: python -m pytest -q

  sourcing:
    # Answers the one risk that cannot be tested from a developer machine:
    # does YouTube serve captions to a GitHub datacenter IP?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -e .
      - name: Probe the source cascade from a datacenter IP
        run: python -m tpsermons.cli diagnose
