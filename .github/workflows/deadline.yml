name: Monday deadline check

# The guide has to be usable by 18:00 ET Monday. This runs at 15:00 ET, which
# leaves three hours to react if something has gone wrong or the church simply
# has not published yet. It never fixes anything -- it just refuses to let a
# miss be silent.

on:
  schedule:
    - cron: '0 19 * * 1'      # 15:00 ET during EDT
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is this week's guide published?
        id: check
        run: |
          NEWEST=$(ls guides/*.json 2>/dev/null | sort | tail -1)
          if [ -z "$NEWEST" ]; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"; echo "age=none" >> "$GITHUB_OUTPUT"; exit 0
          fi
          GUIDE_DATE=$(basename "$NEWEST" | cut -d- -f1-3)
          AGE=$(( ( $(date -u +%s) - $(date -u -d "$GUIDE_DATE" +%s) ) / 86400 ))
          echo "age=$AGE" >> "$GITHUB_OUTPUT"
          echo "title=$GUIDE_DATE" >> "$GITHUB_OUTPUT"
          # A guide from the sermon two days ago (Sunday) is current. Anything
          # older than 3 days means this week's has not landed.
          if [ "$AGE" -le 3 ]; then echo "fresh=true" >> "$GITHUB_OUTPUT";
          else echo "fresh=false" >> "$GITHUB_OUTPUT"; fi

      - name: Raise the alarm
        if: steps.check.outputs.fresh != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const age = '${{ steps.check.outputs.age }}';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `No guide for tonight (checked 15:00 ET Monday)`,
              body: [
                'This week\'s guide is **not published** and the group meets at 19:00.',
                '',
                `Newest guide on the site is ${age} days old.`,
                '',
                'Most likely the church has not posted the sermon yet — about one week',
                'in six it lands Monday, and twice in the last 60 it landed Tuesday.',
                '',
                '**Options:** wait (the job polls every 30 minutes and will publish as',
                'soon as the episode appears), or run tonight on last week\'s guide.',
                '',
                `[Latest runs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions)`,
              ].join('\n'),
              labels: ['deadline'],
            });
