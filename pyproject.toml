[project]
name = "tpsermons"
version = "0.1.0"
description = "Small-group discussion guides from Traders Point Christian Church sermons"
requires-python = ">=3.9"
dependencies = ["youtube-transcript-api>=1.0", "openai>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
